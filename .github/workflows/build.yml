# Builds and tests the plugin while it lives outside the jenkinsci organization.
# Once hosted, ci.jenkins.io builds it from the Jenkinsfile and this workflow can be removed.
name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: mvn verify (Java ${{ matrix.java }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java: [21, 25]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven
      - name: Build and test
        run: mvn -B -ntp -Dsurefire.useFile=false verify
      - name: Show formatting fixes
        if: failure()
        run: |
          mvn -B -ntp -q spotless:apply
          git --no-pager diff

  hosting-checks:
    # The checks the Jenkins hosting team runs on a hosting request:
    # https://github.com/jenkins-infra/repository-permissions-updater#running-the-hosting-checks-locally
    # They read the default branch from GitHub, so they only run for it.
    name: Jenkins hosting checks
    if: github.event_name != 'pull_request' && github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25
      - name: Check out the hosting checker
        run: git clone --depth 1 https://github.com/jenkins-infra/repository-permissions-updater.git "$RUNNER_TEMP/rpu"
      - name: Run the hosting checks
        env:
          GITHUB_TOKEN: ${{ github.token }}
          # Set the repository variable JENKINS_USER to your https://accounts.jenkins.io user name
          JENKINS_USER: ${{ vars.JENKINS_USER || github.repository_owner }}
        run: >-
          "$RUNNER_TEMP/rpu/bin/check-hosting.sh"
          --repository-url "https://github.com/${{ github.repository }}"
          --new-repository-name pytest-html-reporter-plugin
          --github-user "${{ github.repository_owner }}"
          --jenkins-user "$JENKINS_USER"
