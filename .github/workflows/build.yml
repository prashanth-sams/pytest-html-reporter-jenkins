# Builds and tests the plugin while it lives outside the jenkinsci organization.
# Once hosted, ci.jenkins.io builds it from the Jenkinsfile and this workflow can be removed.
name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: mvn verify (Java ${{ matrix.java }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java: [21, 25]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven
      - name: Build and test
        run: mvn -B -ntp -Dsurefire.useFile=false verify
      - name: Show formatting fixes
        if: failure()
        run: |
          mvn -B -ntp -q spotless:apply
          git --no-pager diff
