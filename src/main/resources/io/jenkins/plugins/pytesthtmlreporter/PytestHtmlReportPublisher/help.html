<div>
  Publishes the report written by <code>pytest --html-report=&lt;dir&gt;</code> (the
  <a href="https://pypi.org/project/pytest-html-reporter/">pytest-html-reporter</a> package).
  The report is copied into the build, linked from the build page, and the totals in
  <code>output.json</code> are drawn as a trend on the job page.
